[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — Just A Rather Very Intelligent System. An AI-powered anime desktop companion."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"

authors = [
    { name = "JARVIS Dev" }
]

keywords = ["ai", "assistant", "desktop", "anime", "langgraph", "gemini"]

dependencies = [
    "ddgs>=9.16.1",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "ollama>=0.6.3",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "uvicorn>=0.53.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/JARVIS"
Repository = "https://github.com/yourusername/JARVIS"

[project.scripts]
jarvis = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Tell hatchling which folders are Python packages to ship
packages = ["agents", "core"]

[tool.ruff]
# Ruff config lives in .ruff.toml

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
]
